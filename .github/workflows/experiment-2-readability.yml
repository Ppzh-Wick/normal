name: Validate Experiment 2 archive readability
on:
  push:
    branches: [experiment-2-readability]
concurrency:
  group: experiment-2-readability-review
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/experiment-2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci && npm test && npm run build
      - run: npm install --no-save --package-lock=false playwright@1.64.1 && npx playwright install --with-deps chromium
      - run: node scripts/verify-pair-focus.mjs
      - run: node scripts/verify-archive-readability.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: experiment-2-readability-review
          path: experiments/experiment-2/review
          retention-days: 7
  inspect:
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [timeline-desktop, timeline-mobile, network-desktop, images-desktop]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: experiment-2-readability-review
          path: review
      - name: Export bounded public review screenshot
        env:
          REVIEW_IMAGE: ${{ matrix.image }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='review/readability/'+process.env.REVIEW_IMAGE+'.jpg';
          const base64=fs.readFileSync(file).toString('base64');
          console.log('__IMAGE_START__');
          for(let i=0;i<base64.length;i+=12000)console.log('__IMAGE_CHUNK__ '+base64.slice(i,i+12000));
          console.log('__IMAGE_END__');
          NODE
