name: Validate Experiment 2 pair focus
on:
  push:
    branches:
      - experiment-2-pair-focus
    paths:
      - 'experiments/experiment-2/**'
      - '.github/workflows/experiment-2-pair-focus.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/experiment-2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install, test and build
        run: |
          npm ci
          npm test
          npm run build
      - name: Install the official browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Test focused graph in Chromium
        run: node scripts/verify-pair-focus.mjs
      - name: Export scoped public build and review files
        if: always()
        run: node scripts/export-pair-review.mjs
      - name: Retain review artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experiment-2-pair-review
          path: |
            experiments/experiment-2/dist
            experiments/experiment-2/review/pair-focus
          retention-days: 7
