name: Inspect official Li Chengsan photo sources
on:
  push:
    branches: [portrait-source-research]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public official sources without credentials
        run: |
          python - <<'PY'
          import urllib.request, re, base64, struct, json
          urls=[
            "https://ces.cdut.edu.cn/__local/0/3C/D2/382C7EAE90985F38F20986A4645_D6872932_98E3.png?e=.png",
            "https://www.cdut.edu.cn/info/1061/22207.htm"
          ]
          for url in urls:
            print("SOURCE",url)
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=30) as r:
                data=r.read(3000000); ct=r.headers.get("Content-Type")
              print("RESULT",ct,len(data))
              if data.startswith(b'\x89PNG'):
                print("PNG_SIZE",struct.unpack(">II",data[16:24]))
                print("PHOTO_BASE64",base64.b64encode(data).decode())
              elif 'html' in (ct or ''):
                text=data.decode('utf-8','replace')
                for x in re.findall(r'<img[^>]+>',text,re.I):print("IMAGE_TAG",x)
            except Exception as e:print("ERROR",repr(e))
          PY
